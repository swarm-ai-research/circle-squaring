[project]
name = "circle-squaring"
version = "0.1.0"
description = "Discrete analogue of Tarski's circle squaring via bounded-distance matching (after Máthé–Noel–Pikhurko, arXiv:2202.01412)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "pillow"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
# PLW1514 is a preview rule; opt into it alone rather than all of preview.
preview = true

[tool.ruff.lint]
select = ["PLW1510", "PLW1514"]
explicit-preview-rules = true
